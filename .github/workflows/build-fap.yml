name: Build FAP

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FALLBACK_VERSION: "0.1.0"

jobs:
  build:
    name: Build (${{ matrix.sdk-channel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk-channel:
          - release
          - dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Version resolution needs the complete reachable tag history.
          fetch-depth: 0

      - name: Resolve build version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # Capture the source revision before generated version edits are made.
          short_sha="$(git rev-parse --short=7 HEAD)"
          semver_regex='^v[0-9]+\.[0-9]+\.[0-9]+$'

          event_tag=""
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            event_tag="${GITHUB_REF_NAME}"
            if [[ ! "${event_tag}" =~ ${semver_regex} ]]; then
              echo "::error::Release tags must use the form vX.Y.Z (received '${event_tag}')."
              exit 1
            fi
          fi

          # A commit that already has a semantic-version tag is a clean release
          # version even when this run was triggered through a branch or manually.
          exact_tag="${event_tag}"
          if [[ -z "${exact_tag}" ]]; then
            exact_tag="$({
              git tag --points-at HEAD \
                | grep -E "${semver_regex}" \
                | sort -V \
                | tail -n 1
            } || true)"
          fi

          if [[ -n "${exact_tag}" ]]; then
            base_version="${exact_tag#v}"
            display_version="${base_version}"
          else
            # Use the highest reachable semantic-version tag as the development
            # baseline. Repositories with no version tag start at 0.1.0.
            previous_tag="$({
              git tag --merged HEAD \
                | grep -E "${semver_regex}" \
                | sort -V \
                | tail -n 1
            } || true)"

            if [[ -n "${previous_tag}" ]]; then
              base_version="${previous_tag#v}"
            else
              base_version="${FALLBACK_VERSION}"
            fi

            display_version="${base_version}-${short_sha}"
          fi

          echo "base=${base_version}" >> "${GITHUB_OUTPUT}"
          echo "display=${display_version}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "exact_tag=${exact_tag}" >> "${GITHUB_OUTPUT}"

          echo "Base FAP version: ${base_version}"
          echo "Displayed app version: ${display_version}"

      - name: Inject build version
        shell: bash
        env:
          BASE_VERSION: ${{ steps.version.outputs.base }}
          DISPLAY_VERSION: ${{ steps.version.outputs.display }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          replacements = (
              (
                  Path("application.fam"),
                  r'(fap_version\s*=\s*")[^"]*(")',
                  rf'\g<1>{os.environ["BASE_VERSION"]}\g<2>',
                  "fap_version",
              ),
              (
                  Path("src/amiibo_zero.h"),
                  r'(#define\s+AZ_APP_VERSION\s+")[^"]*(")',
                  rf'\g<1>{os.environ["DISPLAY_VERSION"]}\g<2>',
                  "AZ_APP_VERSION",
              ),
          )

          for path, pattern, replacement, field in replacements:
              source = path.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, source, count=1)
              if count != 1:
                  raise SystemExit(f"Could not update {field} in {path}")
              path.write_text(updated, encoding="utf-8")
          PY

          grep -n 'fap_version' application.fam
          grep -n 'AZ_APP_VERSION' src/amiibo_zero.h

      - name: Build Amiibo Zero with uFBT
        id: build-app
        uses: flipperdevices/flipperzero-ufbt-action@v0.1.4
        with:
          app-dir: .
          sdk-channel: ${{ matrix.sdk-channel }}
          task: build

      - name: Upload FAP artifact
        uses: actions/upload-artifact@v7
        with:
          name: amiibo-zero-${{ matrix.sdk-channel }}
          path: ${{ steps.build-app.outputs.fap-artifacts }}
          if-no-files-found: error
          retention-days: 14

  web:
    name: Build Web Serial installer
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download release-channel FAP from this build
        uses: actions/download-artifact@v8
        with:
          name: amiibo-zero-release
          path: web-fap

      - name: Inject release FAP into web installer
        shell: bash
        run: |
          set -euo pipefail

          fap_path="$(find web-fap -type f -name '*.fap' -print -quit)"
          if [[ -z "${fap_path}" ]]; then
            echo "::error::Release-channel build did not produce a .fap file."
            exit 1
          fi

          cp "${fap_path}" web/public/amiibo_zero.fap

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release_version="${GITHUB_REF_NAME#v}"
          else
            release_version="development-${GITHUB_SHA::7}"
          fi

          fap_size="$(stat -c '%s' web/public/amiibo_zero.fap)"
          fap_sha256="$(sha256sum web/public/amiibo_zero.fap | awk '{print $1}')"

          python3 - <<PY
          import json
          from pathlib import Path

          manifest = {
              "version": "${release_version}",
              "fap": "amiibo_zero.fap",
              "fapSize": int("${fap_size}"),
              "fapSha256": "${fap_sha256}",
              "commit": "${GITHUB_SHA}",
          }
          Path("web/public/release.json").write_text(
              json.dumps(manifest, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

          cat web/public/release.json

      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Test web installer
        working-directory: web
        run: npm test

      - name: Build web installer
        working-directory: web
        run: npm run build

      - name: Upload web build artifact
        uses: actions/upload-artifact@v7
        with:
          name: amiibo-zero-web
          path: web/dist
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - build
      - web
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Validate release tag
        id: release-version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use the form vX.Y.Z."
            exit 1
          fi

          echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"

      - name: Download release-channel FAP
        uses: actions/download-artifact@v8
        with:
          name: amiibo-zero-release
          path: release-dist

      - name: Public release
        uses: softprops/action-gh-release@v2
        with:
          name: "Amiibo Zero v${{ steps.release-version.outputs.version }}"
          tag_name: "v${{ steps.release-version.outputs.version }}"
          draft: false
          generate_release_notes: true
          files: |
            release-dist/*.fap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pages:
    name: Deploy release installer to GitHub Pages
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - web
      - release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download web build from this release run
        uses: actions/download-artifact@v8
        with:
          name: amiibo-zero-web
          path: pages-dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
