name: Build FAP

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.sdk-channel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk-channel:
          - release
          - dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Amiibo Zero with uFBT
        id: build-app
        uses: flipperdevices/flipperzero-ufbt-action@v0.1.4
        with:
          app-dir: .
          sdk-channel: ${{ matrix.sdk-channel }}
          task: build

      - name: Upload FAP artifact
        uses: actions/upload-artifact@v7
        with:
          name: amiibo-zero-${{ matrix.sdk-channel }}-${{ steps.build-app.outputs.suffix }}
          path: ${{ steps.build-app.outputs.fap-artifacts }}
          if-no-files-found: error
          retention-days: 14
